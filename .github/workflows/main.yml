name: Build CBM Editor

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - both
      edition:
        description: Editor edition to build
        required: true
        default: preview
        type: choice
        options:
          - preview
          - release
          - both
      microsoft_store:
        description: Build an MSIX package for Microsoft Store
        required: true
        default: false
        type: boolean
      store_identity_name:
        description: Partner Center package identity name
        required: false
        default: ""
        type: string
      store_publisher:
        description: Partner Center package publisher
        required: false
        default: ""
        type: string
      store_publisher_display_name:
        description: Partner Center publisher display name
        required: false
        default: "Splash!"
        type: string
      store_version:
        description: Four-part Store package version ending in .0
        required: false
        default: ""
        type: string
      save_artifacts:
        description: Save downloads on the workflow run
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cbm-editor-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14.7"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  CBM_BUILD_EDITION: ${{ inputs.edition }}

jobs:
  validate:
    name: Validate build selection
    runs-on: ubuntu-22.04
    steps:
      - name: Validate Microsoft Store options
        shell: bash
        env:
          MICROSOFT_STORE: ${{ inputs.microsoft_store }}
          STORE_IDENTITY_NAME: ${{ inputs.store_identity_name }}
          STORE_PUBLISHER: ${{ inputs.store_publisher }}
          STORE_VERSION: ${{ inputs.store_version }}
        run: |
          if [[ "$MICROSOFT_STORE" == "true" ]]; then
            if [[ -z "$STORE_IDENTITY_NAME" ]]; then
              echo "::error::Partner Center package identity name is required for a Microsoft Store build."
              exit 1
            fi
            if [[ -z "$STORE_PUBLISHER" ]]; then
              echo "::error::Partner Center package publisher is required for a Microsoft Store build."
              exit 1
            fi
            if [[ -z "$STORE_VERSION" ]]; then
              echo "::error::A four-part Store version ending in .0 is required for a Microsoft Store build."
              exit 1
            fi
          fi

  linux-x64:
    name: Linux x64
    needs: validate
    if: ${{ !inputs.microsoft_store && (inputs.platform == 'linux' || inputs.platform == 'both') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install compiler and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache patchelf
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-build.txt

      - name: Download appimagetool
        shell: bash
        run: |
          mkdir -p build/tools
          curl --fail --location --retry 3 --output build/tools/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  build/tools/appimagetool" | sha256sum --check
          chmod 755 build/tools/appimagetool

      - name: Build AppImage with Nuitka
        shell: bash
        env:
          APPIMAGETOOL: ${{ github.workspace }}/build/tools/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: bash scripts/build_nuitka_linux.sh

      - name: Package preview AppImage
        if: inputs.save_artifacts && (inputs.edition == 'preview' || inputs.edition == 'both')
        shell: bash
        run: |
          mkdir -p artifacts
          preview_file="$(find build/appimage/linux -maxdepth 1 -type f -name 'CBM_Editor_v*-pre*.AppImage' -print -quit)"
          test -n "$preview_file"
          preview_name="$(basename "$preview_file")"
          chmod 755 "$preview_file"
          tar --directory=build/appimage/linux --create --gzip \
            --file="artifacts/${preview_name}.tar.gz" \
            "$preview_name"

      - name: Save preview AppImage
        if: inputs.save_artifacts && (inputs.edition == 'preview' || inputs.edition == 'both')
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/CBM_Editor_v*-pre*.AppImage.tar.gz
          if-no-files-found: error
          retention-days: 7
          archive: false

      - name: Package release AppImage
        if: inputs.save_artifacts && (inputs.edition == 'release' || inputs.edition == 'both')
        shell: bash
        run: |
          mkdir -p artifacts
          release_file="$(find build/appimage/linux -maxdepth 1 -type f -name 'CBM_Editor_v*.AppImage' ! -name '*-pre*' -print -quit)"
          test -n "$release_file"
          release_name="$(basename "$release_file")"
          chmod 755 "$release_file"
          tar --directory=build/appimage/linux --create --gzip \
            --file="artifacts/${release_name}.tar.gz" \
            "$release_name"

      - name: Save release AppImage
        if: inputs.save_artifacts && (inputs.edition == 'release' || inputs.edition == 'both')
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/CBM_Editor_v*.AppImage.tar.gz
          if-no-files-found: error
          retention-days: 7
          archive: false

  windows-x64:
    name: Windows x64
    needs: validate
    if: ${{ inputs.microsoft_store || inputs.platform == 'windows' || inputs.platform == 'both' }}
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-build.txt

      - name: Build editor
        shell: pwsh
        env:
          MICROSOFT_STORE: ${{ inputs.microsoft_store }}
          STORE_IDENTITY_NAME: ${{ inputs.store_identity_name }}
          STORE_PUBLISHER: ${{ inputs.store_publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.store_publisher_display_name }}
          STORE_VERSION: ${{ inputs.store_version }}
        run: |
          if ($env:MICROSOFT_STORE -eq "true") {
            $storeArguments = @{
              PythonExe = "python"
              Edition = "Release"
              MicrosoftStore = $true
              StoreIdentityName = $env:STORE_IDENTITY_NAME
              StorePublisher = $env:STORE_PUBLISHER
              StorePublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
            }
            if (-not [string]::IsNullOrWhiteSpace($env:STORE_VERSION)) {
              $storeArguments.StoreVersion = $env:STORE_VERSION
            }
            ./scripts/build_nuitka_windows.ps1 @storeArguments
          } else {
            ./scripts/build_nuitka_windows.ps1 `
              -PythonExe python `
              -Edition $env:CBM_BUILD_EDITION `
              -NoDll
          }

      - name: Save preview ZIP
        if: ${{ inputs.save_artifacts && !inputs.microsoft_store && (inputs.edition == 'preview' || inputs.edition == 'both') }}
        uses: actions/upload-artifact@v7
        with:
          path: build/nuitka/windows/preview/CBM_Editor_v*-pre*.zip
          if-no-files-found: error
          retention-days: 7
          archive: false

      - name: Save release ZIP
        if: ${{ inputs.save_artifacts && !inputs.microsoft_store && (inputs.edition == 'release' || inputs.edition == 'both') }}
        uses: actions/upload-artifact@v7
        with:
          path: build/nuitka/windows/release/CBM_Editor_v*.zip
          if-no-files-found: error
          retention-days: 7
          archive: false

      - name: Save Microsoft Store MSIX
        if: ${{ inputs.save_artifacts && inputs.microsoft_store }}
        uses: actions/upload-artifact@v7
        with:
          path: build/nuitka/windows/store/CBM_Editor_*_x64.msix
          if-no-files-found: error
          retention-days: 7
          archive: false
